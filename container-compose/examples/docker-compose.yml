services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  web:
    image: alpine:latest
    command: ["sh", "-c", "echo Hello from web, redis should resolve at redis:6379 && sleep 3600"]
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    ports:
      - "8080:80"

volumes:
  redis-data:
